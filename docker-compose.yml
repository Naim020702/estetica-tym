services:
  postgres:
    image: postgres:16-alpine
    container_name: estetica_tym_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-estetica}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-estetica123}
      POSTGRES_DB: ${DB_NAME:-estetica_tym}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-estetica} -d ${DB_NAME:-estetica_tym}"]
      interval: 5s
      timeout: 5s
      retries: 5
